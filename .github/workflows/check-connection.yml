name: Verify Instagram connection
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-connection.yml'
permissions:
  contents: read
concurrency:
  group: istanbul-highlights-automatic
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r worker-requirements.txt
      - name: Verify intended account without uploading anything
        env:
          IG_USERNAME: istanbul.highlights
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSION: ${{ secrets.IG_SESSION }}
        run: python instagram_connection.py
