name: Istanbul Highlights automatic posts
on:
  schedule:
    # Owner explicitly approved frequent checks on Oct 17.
    # Istanbul 09:07-23:47 every 20 minutes; Python limits publication to 09,11,17 slots.
    - cron: '7,27,47 6-20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: istanbul-highlights-automatic
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r worker-requirements.txt
      - name: Publish only the current unfilled slot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IG_USERNAME: istanbul.highlights
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSION: ${{ secrets.IG_SESSION }}
        run: python automatic.py
