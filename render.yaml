services:
  - type: web
    name: istanbul-highlights-panel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn panel.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PANEL_SESSION_SECRET
        generateValue: true
      - key: PANEL_PASSWORD
        sync: false
